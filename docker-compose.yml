# Data stores only.
#
# The backend and frontend run on the host with `npm run dev` rather than in
# containers: WebAuthn is bound to a hostname, and keeping the app on
# localhost avoids invalidating every registered passkey the moment someone
# changes how it is served. There are deliberately no Dockerfiles here.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prism_user
      POSTGRES_PASSWORD: prism_password
      POSTGRES_DB: prism_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prism_user -d prism_db']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
